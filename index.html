<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CaliSprint</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f17">
  
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #151c28;
      --card-border: #242f42;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #34d399;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px 16px 80px 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 { font-size: 1.3rem; font-weight: 700; }

    .streak-badge {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* Week Navigation */
    .week-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }
    .week-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }
    .week-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Day Selector Tabs */
    .day-selector {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .day-chip {
      flex: 1;
      padding: 8px 2px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .day-chip .d-name { font-size: 0.75rem; font-weight: 600; }
    .day-chip .d-num { font-size: 0.65rem; opacity: 0.8; }
    
    .day-chip.active {
      background: var(--accent);
      color: #0b0f17;
      border-color: var(--accent);
    }
    .day-chip.has-data:not(.active) {
      border-color: var(--success);
    }

    /* Main Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }
    .card-title { font-size: 1.05rem; font-weight: 600; }
    .card-subtitle { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* Exercise Items */
    .exercise-item {
      background: #0f1520;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .exercise-item.done {
      border-color: var(--success);
      background: rgba(52, 211, 153, 0.05);
    }
    .exercise-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .exercise-name { font-size: 0.9rem; font-weight: 600; }
    .custom-checkbox {
      width: 22px;
      height: 22px;
      accent-color: var(--success);
      cursor: pointer;
    }

    /* Multi-set input boxes */
    .set-inputs {
      display: flex;
      gap: 8px;
    }
    .input-field {
      width: 100%;
      background: #1a2233;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
      text-align: center;
    }
    .input-field:focus { border-color: var(--accent); }

    .meta-inputs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #0b0f17;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn:active { transform: scale(0.98); }

    /* Graph Canvas */
    canvas {
      width: 100%;
      height: 170px;
      display: block;
      margin-top: 10px;
    }

    .backup-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 7px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      flex: 1;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #0b0f17;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <h1>CaliSprint</h1>
    <div class="streak-badge" id="totalSessionsBadge">0 Logged</div>
  </header>

  <!-- Week Switcher -->
  <div class="week-nav">
    <button class="week-btn" id="prevWeekBtn">&larr; Prev</button>
    <div class="week-label" id="weekRangeLabel">Current Week</div>
    <button class="week-btn" id="nextWeekBtn">Next &rarr;</button>
  </div>

  <!-- Weekday Tabs -->
  <div class="day-selector" id="daySelector"></div>

  <!-- Active Workout Card -->
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title" id="routineName">Loading...</div>
        <div class="card-subtitle" id="routineDesc">Loading...</div>
      </div>
      <span style="font-size: 0.8rem; color: var(--accent);" id="completionRate">0%</span>
    </div>
    <div id="exerciseList"></div>
  </div>

  <div class="meta-inputs">
    <input type="number" step="0.1" id="dailyWeight" class="input-field" placeholder="Bodyweight (kg)" style="text-align: left; padding-left: 10px;">
    <input type="text" id="dailyNotes" class="input-field" placeholder="Notes (energy, reps, pain...)" style="text-align: left; padding-left: 10px;">
  </div>

  <button class="btn" id="saveBtn">Save Entry for Selected Day</button>

  <!-- Weight Graph -->
  <div class="card" style="margin-top: 14px;">
    <div class="card-header">
      <div>
        <div class="card-title">Weight Trajectory</div>
        <div class="card-subtitle" id="graphSubtitle">Log at least 2 days of weight</div>
      </div>
    </div>
    <canvas id="weightCanvas"></canvas>
    
    <div class="backup-actions">
      <button class="btn-secondary" id="exportBtn">Export Backup</button>
      <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Import Backup</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
      <button class="btn-secondary" id="clearBtn">Clear All</button>
    </div>
  </div>

  <div id="toast" class="toast">Saved!</div>

  <script>
    const ROUTINES = {
      1: {
        title: "Upper Body A (Vertical & Chest)",
        desc: "Pull vs Dip | Deficit Push vs Row",
        exercises: ["Pull-Ups", "Parallel Bar Dips", "Deficit Push-Ups", "Inverted Rows"]
      },
      2: {
        title: "Ground: Sprint Re-Entry",
        desc: "Acceleration drills & 75-80% sprints",
        exercises: ["Dynamic Warmup & Drills", "5 × 40m Acceleration Sprints", "Hamstring & Hip Stretch"]
      },
      3: {
        title: "Lower Body & Core",
        desc: "Unilateral strength & core compression",
        exercises: ["Bulgarian Split Squats", "Single-Leg RDLs", "Hanging Knee Raises", "Hollow Body Hold"]
      },
      4: {
        title: "Active Recovery & Mobility",
        desc: "Zone 2 aerobic flush & joint health",
        exercises: ["20-25 Min Easy Jog", "Ankle & Hip Mobility"]
      },
      5: {
        title: "Upper Body B (Delts & Triceps)",
        desc: "Pike press focus & chin-up strength",
        exercises: ["Pike Push-Ups", "Chin-Ups", "Diamond Push-Ups", "Wide Inverted Rows"]
      },
      6: {
        title: "Speed & Sprint Volume",
        desc: "Form, top-end speed, and full rest",
        exercises: ["Sprint Warmup Drills", "6 × 50m Build-Up Sprints", "Side Planks (2 sets/side)"]
      },
      0: {
        title: "Full Recovery Day",
        desc: "Tissue repair, rest, and walking",
        exercises: ["8,000 - 10,000 Easy Steps", "Protein Target Hit (140g+)"]
      }
    };

    // State
    let currentWeekOffset = 0; // 0 = current week, -1 = last week, etc.
    let selectedDateStr = formatDate(new Date());
    let logs = JSON.parse(localStorage.getItem('calisprint_v2_logs') || '{}');

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getWeekDays(offset) {
      const now = new Date();
      const currentDay = now.getDay(); // 0 = Sun, 1 = Mon ...
      // Start week on Monday (1)
      const diffToMonday = (currentDay === 0 ? -6 : 1) - currentDay;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diffToMonday + (offset * 7));

      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        days.push(d);
      }
      return days;
    }

    function renderTabs() {
      const days = getWeekDays(currentWeekOffset);
      const container = document.getElementById('daySelector');
      container.innerHTML = '';

      const startStr = `${days[0].getDate()} ${days[0].toLocaleString('default', { month: 'short' })}`;
      const endStr = `${days[6].getDate()} ${days[6].toLocaleString('default', { month: 'short' })}`;
      document.getElementById('weekRangeLabel').innerText = `${startStr} - ${endStr}`;

      const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

      days.forEach((dateObj, idx) => {
        const dateKey = formatDate(dateObj);
        const hasData = logs[dateKey] && Object.keys(logs[dateKey].exercises || {}).length > 0;

        const chip = document.createElement('div');
        chip.className = `day-chip ${dateKey === selectedDateStr ? 'active' : ''} ${hasData ? 'has-data' : ''}`;
        chip.innerHTML = `
          <span class="d-name">${dayNames[idx]}</span>
          <span class="d-num">${dateObj.getDate()}</span>
        `;
        chip.onclick = () => {
          selectedDateStr = dateKey;
          renderTabs();
          loadSelectedDay();
        };
        container.appendChild(chip);
      });
    }

    function loadSelectedDay() {
      // Parse day of week from selected date
      const parts = selectedDateStr.split('-');
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const dayOfWeek = d.getDay(); // 0=Sun, 1=Mon...

      const routine = ROUTINES[dayOfWeek];
      document.getElementById('routineName').innerText = routine.title;
      document.getElementById('routineDesc').innerText = routine.desc;

      const list = document.getElementById('exerciseList');
      list.innerHTML = '';

      const dayData = logs[selectedDateStr] || { exercises: {}, weight: '', notes: '' };

      routine.exercises.forEach((name, exIdx) => {
        const item = document.createElement('div');
        const exState = dayData.exercises[exIdx] || { checked: false, s1: '', s2: '', s3: '' };

        item.className = `exercise-item ${exState.checked ? 'done' : ''}`;
        item.innerHTML = `
          <div class="exercise-top">
            <span class="exercise-name">${name}</span>
            <input type="checkbox" class="custom-checkbox" data-ex="${exIdx}" ${exState.checked ? 'checked' : ''}>
          </div>
          <div class="set-inputs">
            <input type="text" class="input-field" placeholder="Set 1" data-ex="${exIdx}" data-set="s1" value="${exState.s1 || ''}">
            <input type="text" class="input-field" placeholder="Set 2" data-ex="${exIdx}" data-set="s2" value="${exState.s2 || ''}">
            <input type="text" class="input-field" placeholder="Set 3" data-ex="${exIdx}" data-set="s3" value="${exState.s3 || ''}">
          </div>
        `;

        const chk = item.querySelector('input[type="checkbox"]');
        chk.onchange = (e) => {
          item.classList.toggle('done', e.target.checked);
          updateCompletion();
        };

        list.appendChild(item);
      });

      document.getElementById('dailyWeight').value = dayData.weight || '';
      document.getElementById('dailyNotes').value = dayData.notes || '';
      updateCompletion();
    }

    function updateCompletion() {
      const checkboxes = document.querySelectorAll('#exerciseList input[type="checkbox"]');
      if (!checkboxes.length) return;
      let checked = 0;
      checkboxes.forEach(c => { if (c.checked) checked++; });
      document.getElementById('completionRate').innerText = `${Math.round((checked / checkboxes.length) * 100)}%`;
    }

    document.getElementById('saveBtn').onclick = () => {
      const exRows = document.querySelectorAll('#exerciseList .exercise-item');
      const exercises = {};

      exRows.forEach((row, i) => {
        const checked = row.querySelector('.custom-checkbox').checked;
        const s1 = row.querySelector('[data-set="s1"]').value;
        const s2 = row.querySelector('[data-set="s2"]').value;
        const s3 = row.querySelector('[data-set="s3"]').value;
        exercises[i] = { checked, s1, s2, s3 };
      });

      const weight = document.getElementById('dailyWeight').value;
      const notes = document.getElementById('dailyNotes').value;

      logs[selectedDateStr] = {
        exercises,
        weight: weight ? parseFloat(weight) : null,
        notes
      };

      localStorage.setItem('calisprint_v2_logs', JSON.stringify(logs));
      showToast('Saved for ' + selectedDateStr);
      renderTabs();
      updateBadge();
      drawGraph();
    };

    function updateBadge() {
      const count = Object.keys(logs).filter(k => logs[k].exercises && Object.keys(logs[k].exercises).length > 0).length;
      document.getElementById('totalSessionsBadge').innerText = `${count} Logged`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Week navigation listeners
    document.getElementById('prevWeekBtn').onclick = () => {
      currentWeekOffset--;
      renderTabs();
    };
    document.getElementById('nextWeekBtn').onclick = () => {
      currentWeekOffset++;
      renderTabs();
    };

    // Graph
    function drawGraph() {
      const canvas = document.getElementById('weightCanvas');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();

      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const entries = Object.keys(logs)
        .filter(d => logs[d].weight)
        .sort()
        .map(d => ({ date: d.slice(5), weight: logs[d].weight }));

      if (entries.length < 2) {
        ctx.fillStyle = '#64748b';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Log bodyweight on at least 2 days to draw graph', w / 2, h / 2);
        return;
      }

      document.getElementById('graphSubtitle').innerText = `${entries[0].weight}kg → ${entries[entries.length - 1].weight}kg`;

      const weights = entries.map(e => e.weight);
      const minW = Math.min(...weights) - 1;
      const maxW = Math.max(...weights) + 1;
      const pad = 30;

      const getX = i => pad + (i / (entries.length - 1)) * (w - pad * 2);
      const getY = val => (h - pad) - ((val - minW) / (maxW - minW)) * (h - pad * 2);

      // Line
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      entries.forEach((e, i) => {
        const x = getX(i);
        const y = getY(e.weight);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Points & Labels
      entries.forEach((e, i) => {
        const x = getX(i);
        const y = getY(e.weight);

        ctx.fillStyle = '#0b0f17';
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#94a3b8';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${e.weight}`, x, y - 8);
        ctx.fillText(`${e.date}`, x, h - 8);
      });
    }

    // Export / Import
    document.getElementById('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `calisprint_backup_${selectedDateStr}.json`;
      a.click();
    };

    document.getElementById('importFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imported = JSON.parse(evt.target.result);
          logs = { ...logs, ...imported };
          localStorage.setItem('calisprint_v2_logs', JSON.stringify(logs));
          renderTabs();
          loadSelectedDay();
          drawGraph();
          updateBadge();
          showToast('Import successful!');
        } catch(err) {
          alert('Invalid backup JSON file.');
        }
      };
      reader.readAsText(file);
    };

    document.getElementById('clearBtn').onclick = () => {
      if (confirm('Permanently delete all saved entries on this device?')) {
        localStorage.removeItem('calisprint_v2_logs');
        logs = {};
        renderTabs();
        loadSelectedDay();
        drawGraph();
        updateBadge();
      }
    };

    window.addEventListener('resize', drawGraph);

    // Initial Load
    renderTabs();
    loadSelectedDay();
    updateBadge();
    drawGraph();
  </script>
</body>
</html>
